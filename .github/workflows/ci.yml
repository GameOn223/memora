name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  dart:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages app/lib app/test app/pigeons

      - name: Analyze packages
        run: dart analyze --fatal-infos packages

      - name: Analyze app
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test memora_core
        working-directory: packages/memora_core
        run: dart test

      - name: Test memora_database
        if: hashFiles('packages/memora_database/test/**/*_test.dart') != ''
        working-directory: packages/memora_database
        run: dart test

      - name: Test memora_providers
        if: hashFiles('packages/memora_providers/test/**/*_test.dart') != ''
        working-directory: packages/memora_providers
        run: dart test

      - name: Test app
        if: hashFiles('app/test/**/*_test.dart') != ''
        working-directory: app
        run: flutter test

  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: dart
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve workspace
        run: flutter pub get

      - name: Build
        working-directory: app
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v5
        with:
          name: memora-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
